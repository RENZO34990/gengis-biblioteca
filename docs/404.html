<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Biblioteca Nalanda</title>
<meta name="description" content="Esta página no existe en la Biblioteca Nalanda. Vuelve al índice de cuadernos del Club Kongzhi UNMSM.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1A1A'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23F2EFE9' font-family='Georgia,serif'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/ibm-plex-mono.css">
<link rel="stylesheet" href="assets/fonts/source-serif-4.css">
<style>
  :root{--ink:#1A1A1A; --paper:#F2EFE9; --line:rgba(26,26,26,.18); --soft:#5C5750;}
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{margin:0; min-height:100dvh; display:grid; place-items:center start; padding:8vh 8vw; background:var(--paper); color:var(--ink); font-family:'Source Serif 4', Georgia, serif;}
  main{max-width:34rem;}
  .code{font-family:'IBM Plex Mono', monospace; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--soft);}
  h1{font-size:clamp(2rem,6vw,3.2rem); line-height:1.1; margin:1rem 0 1.2rem; font-weight:600; text-wrap:balance;}
  p{font-size:1.05rem; line-height:1.65; color:var(--soft); margin:0 0 2rem; text-wrap:pretty;}
  a.volver{display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.85rem; color:var(--ink); text-decoration:none; padding:.85rem 1.3rem; border:1px solid var(--ink); transition:background-color .3s cubic-bezier(0.23,1,0.32,1), color .3s cubic-bezier(0.23,1,0.32,1), transform .2s cubic-bezier(0.23,1,0.32,1);}
  @media (hover:hover){a.volver:hover{background:var(--ink); color:var(--paper);}}
  a.volver:active{transform:scale(0.97);}
  a.volver:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  footer{margin-top:3rem; font-family:'IBM Plex Mono', monospace; font-size:.75rem; color:var(--soft);}
</style>
</head>
<body>
<main id="contenido">
  <span class="code">Error 404</span>
  <h1>Esta página no está en la biblioteca</h1>
  <p>El enlace puede estar mal escrito o el cuaderno cambió de lugar. Vuelve al índice para encontrarlo entre los cuadernos de China, Japón y Corea.</p>
  <a class="volver" id="volver" href="./">Volver a Nalanda</a>
  <footer>Club Kongzhi UNMSM / Biblioteca Nalanda</footer>
</main>
<script>
  // GitHub Pages de proyecto: la raíz es /<repo>/. Con dominio propio la raíz es /.
  (function(){
    var seg = location.pathname.split('/')[1];
    var host = location.hostname;
    var a = document.getElementById('volver');
    if(/\.github\.io$/.test(host) && seg){ a.href = '/' + seg + '/'; } else { a.href = '/'; }
  })();
</script>
</body>
</html>
